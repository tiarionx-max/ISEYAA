syntax = "proto3";
package news;

service NewsService {
  rpc ListNews (ListNewsRequest) returns (ListNewsResponse);
}

message ListNewsRequest {
  int32 limit = 1;
  string category = 2;
}

message NewsItemSummary {
  string id = 1;
  string headline = 2;
  string summary = 3;
  string link = 4;
  string source = 5;
  string category = 6;
  string image_url = 7;
  string published_at = 8;
  bool is_priority = 9;
}

message ListNewsResponse {
  repeated NewsItemSummary items = 1;
}
