syntax = "proto3";
package transport;

service TransportService {
  rpc RequestTrip (RequestTripRequest) returns (RequestTripResponse);
  rpc AcceptTrip (AcceptTripRequest) returns (AcceptTripResponse);
  rpc CompleteTrip (CompleteTripRequest) returns (CompleteTripResponse);
  rpc GetTripStatus (GetTripStatusRequest) returns (GetTripStatusResponse);
}

message RequestTripRequest {
  string rider_id = 1;
  string vehicle_type = 2;
  double pickup_lat = 3;
  double pickup_lng = 4;
  string pickup_address = 5;
  double dropoff_lat = 6;
  double dropoff_lng = 7;
  string dropoff_address = 8;
}

message RequestTripResponse {
  string trip_id = 1;
  string status = 2;
  double fare = 3;
}

message AcceptTripRequest {
  string trip_id = 1;
  string driver_id = 2;
}

message AcceptTripResponse {
  bool success = 1;
  string status = 2;
}

message CompleteTripRequest {
  string trip_id = 1;
}

message CompleteTripResponse {
  bool success = 1;
  double fare = 2;
  double driver_earnings = 3;
  double platform_fee = 4;
}

message GetTripStatusRequest {
  string trip_id = 1;
}

message GetTripStatusResponse {
  string trip_id = 1;
  string status = 2;
  string driver_id = 3;
  double fare = 4;
}
