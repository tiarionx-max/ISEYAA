[build]
dockerfilePath = "backend/apps/delivery-otp-service/Dockerfile"
buildContext = "."

[deploy]
watchPaths = ["backend/apps/delivery-otp-service/**", "backend/src/modules/delivery/**", "backend/src/modules/wallet/**", "backend/src/common/**", "packages/proto/**"]
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
