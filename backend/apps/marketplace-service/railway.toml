[build]
dockerfilePath = "backend/apps/marketplace-service/Dockerfile"
buildContext = "."

[deploy]
watchPaths = ["backend/apps/marketplace-service/**", "backend/src/modules/marketplace/**", "packages/proto/**"]
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
