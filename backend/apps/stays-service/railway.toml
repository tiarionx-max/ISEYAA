[build]
dockerfilePath = "backend/apps/stays-service/Dockerfile"
buildContext = "."

[deploy]
watchPaths = ["backend/apps/stays-service/**", "backend/src/modules/stays/**", "packages/proto/**"]
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
