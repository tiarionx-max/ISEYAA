version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: iseyaa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iseyaa
      POSTGRES_PASSWORD: iseyaa_dev_password
      POSTGRES_DB: iseyaa_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iseyaa']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: iseyaa_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: iseyaa_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://iseyaa:iseyaa_dev_password@postgres:5432/iseyaa_dev
      REDIS_URL: redis://redis:6379
      NOTIFICATIONS_SERVICE_URL: notifications-service:5008
      NEWS_SERVICE_URL: news-service:5009
      WAITLIST_SERVICE_URL: waitlist-service:5010
      REVIEWS_SERVICE_URL: reviews-service:5011
      DELIVERY_OTP_SERVICE_URL: delivery-otp-service:5012
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app
      - backend_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notifications-service:
        condition: service_started
      news-service:
        condition: service_started
      waitlist-service:
        condition: service_started
      reviews-service:
        condition: service_started
      delivery-otp-service:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: iseyaa_web
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    ports:
      - '3000:3000'
    volumes:
      - ./web:/app
      - web_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      - backend

  notifications-service:
    build:
      context: .
      dockerfile: backend/apps/notifications-service/Dockerfile
    container_name: iseyaa_notifications_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://iseyaa:iseyaa_dev_password@postgres:5432/iseyaa_dev
      REDIS_URL: redis://redis:6379
    ports:
      - '5008:5008'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  news-service:
    build:
      context: .
      dockerfile: backend/apps/news-service/Dockerfile
    container_name: iseyaa_news_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://iseyaa:iseyaa_dev_password@postgres:5432/iseyaa_dev
      REDIS_URL: redis://redis:6379
    ports:
      - '5009:5009'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  waitlist-service:
    build:
      context: .
      dockerfile: backend/apps/waitlist-service/Dockerfile
    container_name: iseyaa_waitlist_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://iseyaa:iseyaa_dev_password@postgres:5432/iseyaa_dev
      REDIS_URL: redis://redis:6379
    ports:
      - '5010:5010'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  reviews-service:
    build:
      context: .
      dockerfile: backend/apps/reviews-service/Dockerfile
    container_name: iseyaa_reviews_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://iseyaa:iseyaa_dev_password@postgres:5432/iseyaa_dev
      REDIS_URL: redis://redis:6379
    ports:
      - '5011:5011'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  delivery-otp-service:
    build:
      context: .
      dockerfile: backend/apps/delivery-otp-service/Dockerfile
    container_name: iseyaa_delivery_otp_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://iseyaa:iseyaa_dev_password@postgres:5432/iseyaa_dev
      REDIS_URL: redis://redis:6379
    ports:
      - '5012:5012'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  backend_modules:
  web_modules:
  web_next:
