name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

jobs:
  backend:
    name: Backend — Lint / Test / Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iseyaa
          POSTGRES_PASSWORD: iseyaa_test
          POSTGRES_DB: iseyaa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://iseyaa:iseyaa_test@localhost:5432/iseyaa_test
      DIRECT_URL: postgresql://iseyaa:iseyaa_test@localhost:5432/iseyaa_test
      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      JWT_SECRET: ci_jwt_secret_at_least_32_characters_long
      JWT_REFRESH_SECRET: ci_refresh_secret_at_least_32_characters
      # Stub values — services degrade gracefully when keys are absent
      PAYSTACK_SECRET_KEY: stub
      PAYSTACK_WEBHOOK_SECRET: stub
      SENDGRID_API_KEY: stub
      SENDGRID_FROM_EMAIL: noreply@example.com
      RESEND_API_KEY: stub
      SENDCHAMP_API_KEY: stub
      SENDCHAMP_SENDER_NAME: stub
      AWS_ACCESS_KEY_ID: stub
      AWS_SECRET_ACCESS_KEY: stub
      AWS_S3_BUCKET: stub
      AWS_REGION: af-south-1
      AWS_CLOUDFRONT_URL: http://localhost
      ANTHROPIC_API_KEY: stub
      FIREBASE_SERVER_KEY: stub
      GOOGLE_MAPS_API_KEY: stub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Apply migrations to test DB
        working-directory: backend
        # Use migrate deploy (the same path production/Railway runs) rather than
        # `db push`, which only syncs schema.prisma and silently skips raw-SQL
        # migrations — including the partial UNIQUE indexes (e.g.
        # settlement_split_tiers_module_tierName_active_key) that can't be
        # expressed in schema.prisma and that the settlement-split e2e suite
        # asserts. Fresh CI Postgres service = empty DB, so no reset needed.
        run: npx prisma migrate deploy

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm test -- --forceExit --passWithNoTests

      - name: E2E tests (settlement split tier audit trail)
        working-directory: backend
        run: npm run test:e2e:settlement-splits -- --forceExit --passWithNoTests

      - name: E2E tests (tour booking + wallet invariant + KYC encryption)
        working-directory: backend
        run: npm run test:e2e:tours -- --forceExit --passWithNoTests

      - name: Build
        working-directory: backend
        run: npm run build

  web:
    name: Web — Lint / Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXTAUTH_SECRET: ci_nextauth_secret_at_least_32_chars_long
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build

  mobile:
    name: Mobile — Type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        working-directory: mobile
        run: npm run typecheck
